  note: >-
    The trust center lists a "Confidential Reporting Channel" control — "A confidential reporting
    channel is made available to internal personnel and external parties to report security and
    other identified concerns" — but publishes no reachable policy URL, no security contact address
    in the served HTML (contact addresses are rendered client-side and were not recoverable from
    the response body), and no bug bounty program. /.well-known/security.txt returns 404 on
    www.cloudexmachina.io and a soft-200 HTML shell elsewhere; www.cloudexmachina.io/security
    returns 404. Because no disclosure channel could be verified, NO VulnerabilityDisclosure or
    Security pointer is emitted in apis.yml. This is the single clearest, cheapest improvement
    available to Cloud ex Machina: publish an RFC 9116 /.well-known/security.txt naming a Contact
    and a Policy.

aid: cloudexmachina
name: Cloud Ex Machina
description: 'Cloud ex Machina (CxM) builds Dex, an agentic AI teammate for cloud cost and governance
  management. Dex continuously maps AWS, Azure, GCP and Kubernetes estates read-only and agentless,
  infers resource ownership by keeping the cloud connected to the organization''s people and code,
  investigates cost and governance findings, and delivers review-ready remediation — pull requests,
  scripts and CLI instructions — to the engineers who can act, inside the tools they already use.
  The platform integrates with GitHub, GitLab, Jira, Linear, Notion, ServiceNow, Slack and Microsoft
  Teams, ingests non-cloud AI spend from Anthropic, and runs as a per-tenant SaaS with SAML 2.0 SSO.
  Cloud ex Machina publishes no public REST API or machine-readable specification; its developer-facing
  surface is cloud onboarding distributed as a Terraform Registry module, a CloudFormation template
  and a GitHub Action.'
